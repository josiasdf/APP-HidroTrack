<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HidroTrack | Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <header>
            <h1>💧 Novo Cadastro</h1>
            <p>Comece a monitorar sua hidratação</p>
        </header>
        
        <form id="cadastroForm">
            <div class="input-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" placeholder="" required>
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="" required>
            </div>
            <div class="input-group">
                <label>Peso (kg)</label>
                <input type="number" id="peso" placeholder="" required>
            </div>
            <button type="submit" class="btn-login">Criar Minha Conta</button>
        </form>
        
        <footer>
            <p>Já tem conta? <a href="index.html">Voltar para Login</a></p>
        </footer>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
